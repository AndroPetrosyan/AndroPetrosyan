<!doctype html><meta charset=utf-8><style>
@font-face{font-family:N;src:url(Nohemi-VF.woff2)}
*{margin:0;box-sizing:border-box}
body{width:1600px;height:520px;background:#010101;font-family:N,Arial;color:#e5f3fe;overflow:hidden;position:relative}
.glow{position:absolute;inset:-12%;filter:blur(70px) brightness(1.3);background:
 radial-gradient(30% 55% at 82% 70%,#dcecff 0%,#7f9fc4 30%,rgba(81,104,133,.55) 55%,transparent 75%),
 radial-gradient(22% 40% at 60% 105%,#f3ece6 0%,rgba(204,200,198,.6) 35%,transparent 72%),
 linear-gradient(110deg,#010101 35%,#1b2b3c 70%,#364e66)}
.grid{position:absolute;inset:0;background:radial-gradient(circle,transparent 0 4.4px,#010101 5.6px) 0 0/15px 15px}
.c{position:absolute;left:96px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:26px}
svg{width:120px;height:66px;filter:drop-shadow(0 0 12px rgba(229,243,254,.35))}
h1{font-weight:500;font-size:112px;line-height:.95;letter-spacing:-.035em;text-shadow:0 0 30px rgba(229,243,254,.25)}
p{font-size:32px;font-weight:300;color:rgba(229,243,254,.7)}
</style>
<div class=glow></div><div class=grid></div>
<div class=c><h1>Andro<br>Petrosyan</h1><p>Designer and developer, Tbilisi</p></div>
